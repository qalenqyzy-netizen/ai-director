<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>AI-Режиссёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#ECEEF2; --surface:#F8F9FB; --surface-2:#E2E5EA; --ink:#22252B; --ink-2:#5B616C; --ink-3:#8A909A;
  --line:#D2D6DD; --accent:#8A2D5C; --accent-soft:#F2E4EB; --accent-ink:#FFFFFF;
  --ok:#2F7A55; --warn:#A5621A; --err:#B3261E;
  --serif:"Prata",Georgia,"Times New Roman",serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#14161A; --surface:#1C1F24; --surface-2:#262A30; --ink:#E7E9ED; --ink-2:#A0A7B1; --ink-3:#747B86;
    --line:#333840; --accent:#E385B3; --accent-soft:#3A2331; --accent-ink:#1B0F16;
    --ok:#6FCB9A; --warn:#E4A865; --err:#F2847B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#14161A; --surface:#1C1F24; --surface-2:#262A30; --ink:#E7E9ED; --ink-2:#A0A7B1; --ink-3:#747B86;
  --line:#333840; --accent:#E385B3; --accent-soft:#3A2331; --accent-ink:#1B0F16;
  --ok:#6FCB9A; --warn:#E4A865; --err:#F2847B;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;margin:0;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--serif);font-weight:400;text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:1.65rem} h3{font-size:1.2rem}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:20px 14px}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:1.5rem}
.brand small{display:block;font-family:var(--sans);font-size:.78rem;color:var(--ink-2)}
.logo{width:40px;height:40px;color:var(--accent);flex:none}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}

/* stepper */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-block:6px 18px;list-style:none;padding:0}
.steps button{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;cursor:pointer;text-align:left}
.steps .num{font-family:var(--mono);font-size:.78rem;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);flex:none;color:var(--ink-2)}
.steps .t{font-weight:600;font-size:.9rem}
.steps button[aria-current="step"]{border-color:var(--accent);background:var(--accent-soft)}
.steps button[aria-current="step"] .num{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps button.done .num{color:var(--accent);border-color:var(--accent)}
@media (max-width:640px){.steps .t{font-size:.78rem}.steps button{padding:8px;gap:6px;flex-direction:column;align-items:flex-start}}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
@media (max-width:560px){.panel{padding:16px}}
.stack{display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.scard{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px}
.scard .ic{width:34px;height:34px;color:var(--accent)}
.scard b{font-family:var(--serif);font-weight:400;font-size:1.1rem}
.scard span{font-size:.85rem;color:var(--ink-2)}
.scard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-weight:600;font-size:.88rem}
.field .hint{font-size:.8rem;color:var(--ink-3)}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px}
textarea{resize:vertical;min-height:72px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:.86rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.mono{font-size:.8rem}
.rules{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:16px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:5px 10px;font-size:.8rem;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;border-top:1px solid var(--line);padding-top:18px}
.actions .sp{flex:1}

.note{border-radius:var(--r);padding:12px 14px;font-size:.88rem;background:var(--surface-2)}
.note.err{background:color-mix(in srgb,var(--err) 12%,var(--surface));color:var(--ink);border:1px solid color-mix(in srgb,var(--err) 40%,transparent)}
.note.ex{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}

/* job */
.job{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;margin-bottom:16px}
.job .reel{width:26px;height:26px;color:var(--accent);animation:spin 2.4s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.job .txt{flex:1;min-width:200px}
.job .txt b{display:block}

/* questions */
.q{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.q .qn{font-family:var(--mono);color:var(--accent);font-size:.8rem}
.q h4{margin:0;font-size:1rem;font-weight:700}
.q .why{font-size:.85rem;color:var(--ink-2)}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;text-align:left;cursor:pointer;font-size:.88rem}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px}

/* result */
.hero-r{display:flex;flex-direction:column;gap:10px}
.hero-r h2{font-size:2rem}
.logline{font-size:1.08rem;max-width:65ch}
.concept{max-width:70ch;color:var(--ink-2)}
.arc{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.arc > div{padding:12px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.arc > div:last-child{border-right:0}
.arc b{font-family:var(--serif);font-weight:400;font-size:1.02rem}
.arc .mono{font-size:.76rem;color:var(--accent)}
.arc p{font-size:.84rem;color:var(--ink-2)}

.bible{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.bcard{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.bcard .bh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bcard .kv{font-size:.86rem}
.bcard .kv b{font-weight:600}
.code{font-family:var(--mono);font-size:.78rem;line-height:1.6;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto}

.timeline{display:flex;height:54px;border-radius:8px;overflow:hidden;border:1px solid var(--line);gap:2px;background:var(--line)}
.timeline button{border:0;min-width:22px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:4px 7px;font-family:var(--mono);font-size:.72rem;color:var(--ink);overflow:hidden;white-space:nowrap}
.timeline button:hover{filter:brightness(.95)}
.tl-scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.7rem;color:var(--ink-3);margin-top:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.shot{border:1px solid var(--line);border-radius:14px;background:var(--bg);display:grid;grid-template-columns:200px 1fr;overflow:hidden;scroll-margin-top:16px}
.shot.flash{box-shadow:0 0 0 2px var(--accent)}
.shot aside{background:var(--surface);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px}
.shot .no{font-family:var(--serif);font-size:2.2rem;line-height:1;color:var(--accent)}
.shot .tc{font-family:var(--mono);font-size:.8rem}
.frame{border:1.5px solid var(--ink-2);border-radius:3px;height:84px;max-width:100%;background:var(--bg);color:var(--ink-2);overflow:hidden;align-self:flex-start}
.frame svg{display:block;width:100%;height:100%}
.meta{display:flex;flex-direction:column;gap:6px;font-size:.82rem}
.meta div{display:flex;flex-direction:column}
.meta span{color:var(--ink-3);font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.shot .body{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.pill{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.action{font-size:1rem}
.whybox{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:.9rem}
.whybox .label{color:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;font-size:.85rem}
.facts span{display:block;color:var(--ink-3);font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.prompt{display:flex;flex-direction:column;gap:6px}
.prompt .ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.redo{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;border-top:1px dashed var(--line);padding-top:12px}
.redo input{flex:1;min-width:200px}
@media (max-width:720px){.shot{grid-template-columns:1fr}.shot aside{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;align-items:flex-start}.shot aside .meta{flex:1;min-width:160px}}

.tips{counter-reset:t;display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.tips li{display:flex;gap:10px;font-size:.92rem}
.tips li::before{counter-increment:t;content:counter(t);font-family:var(--mono);font-size:.78rem;color:var(--accent);border:1px solid var(--accent);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;flex:none;margin-top:1px}

/* cheat */
.cheat{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.cgroup{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.cgroup dl{margin:0;display:flex;flex-direction:column}
.cgroup .it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line)}
.cgroup dt{font-weight:700;font-size:.9rem}
.cgroup .en{font-family:var(--mono);font-size:.74rem;color:var(--accent);text-align:right;cursor:pointer;background:none;border:0;padding:0}
.cgroup dd{grid-column:1/-1;margin:0;font-size:.84rem;color:var(--ink-2)}

/* outsee */
.os{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.os-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.os-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.86rem}
.os-row .k{font-weight:700;min-width:52px}
.os-row .st{color:var(--ink-2)}
.os-row .price{font-family:var(--mono);font-variant-numeric:tabular-nums}
.os-row a{color:var(--accent);font-weight:700}
.os-row .bad{color:var(--err)}
.os-row .good{color:var(--ok);font-weight:700}
.os-thumb{max-width:180px;border-radius:6px;border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite;flex:none}
@keyframes pulse{50%{opacity:.25}}
.oset{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.oset .field{min-width:180px;flex:1}
.bwrap{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px;align-items:start}
.bside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.bside .code{max-height:320px}
@media (max-width:900px){.bwrap{grid-template-columns:1fr}.bside{position:static}}
.bcat{display:flex;flex-direction:column;gap:12px;padding:20px}
.bcat-h{display:flex;gap:12px;align-items:flex-start}
.bnum{font-family:var(--mono);font-size:.82rem;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--accent);color:var(--accent);flex:none;margin-top:2px}
.bcat .hint{font-size:.84rem;color:var(--ink-2);margin:0}
.chip.rec{border-color:var(--accent);border-style:dashed;color:var(--accent);font-weight:600}
.chip.rec[aria-pressed="true"]{color:var(--accent-ink);border-style:solid}
.odetail{display:flex;gap:14px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;flex-wrap:wrap}
.odetail .frame{flex:none}
.od-t{display:flex;flex-direction:column;gap:6px;flex:1;min-width:200px;font-size:.9rem}
.en-t{font-size:.74rem;color:var(--accent)}
.recwhy{color:var(--accent);font-size:.86rem;font-weight:600}
.advice{border-color:var(--accent);background:linear-gradient(var(--accent-soft),var(--surface) 70%)}
.mist{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:10;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="16" width="30" height="19" rx="2" fill="none" stroke="currentColor" stroke-width="2.2"/><g transform="rotate(-14 5 16)"><rect x="5" y="8" width="30" height="7" rx="1.5" fill="currentColor"/><path d="M11 8l-4 7M18 8l-4 7M25 8l-4 7M32 8l-4 7" stroke="var(--surface)" stroke-width="2.2"/></g><path d="M10 22h20M10 28h12" stroke="currentColor" stroke-width="1.6" opacity=".5"/></svg>
      <div><h1>AI-Режиссёр</h1><small>подсказки режиссёра для AI-креаторов</small></div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-builder" data-tab="builder">Конструктор кадра</button>
      <button role="tab" id="tab-project" data-tab="project">Ролик по брифу</button>
      <button role="tab" id="tab-cheat" data-tab="cheat">Шпаргалка режиссёра</button>
    </div>
  </header>
  <main id="app"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- справочники ---------- */
const SECTIONS = {
  ad:{name:"Реклама бренда",desc:"Имиджевый или продающий ролик для крупного бренда",icon:'<path d="M6 26V14l18-7v26L6 26z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M24 12c4 1 5 3 5 7s-1 6-5 7M9 26l2 7h5l-2-6" fill="none" stroke="currentColor" stroke-width="2"/>',
    logic:"Хук за 1–3 секунды, знакомство с героиней и миром бренда, рост эмоции, кульминация с продуктом, пэкшот и место под логотип. Продукт — отдельный герой: минимум один макро-кадр фактуры и один кадр продукта в действии. Люксовая эстетика: сдержанное движение, мотивированный свет, воздух в кадре."},
  fashion:{name:"Одежда и fashion",desc:"Бельё, одежда, аксессуары: ткань, посадка, движение",icon:'<path d="M13 6l-7 5 3 6 4-2v18h14V15l4 2 3-6-7-5c-1 3-3 4-7 4s-6-1-7-4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
    logic:"Ткань «живёт»: движение, физика шёлка, кружева, трикотажа, макро фактуры и швов. Посадка на теле с разных сторон, каждый ракурс мотивирован действием. Для белья и купальников — эстетика и вкус, без вульгарности. Смена ракурса каждые 2–4 секунды."},
  film:{name:"Мини-кино",desc:"Короткая история с героем, конфликтом и развязкой",icon:'<rect x="5" y="9" width="22" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M27 15l7-4v14l-7-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="18" r="3" fill="currentColor"/>',
    logic:"Трёхактная структура, продукт в сюжете. Монтажная грамматика: правила 180° и 30°, восьмёрка в диалогах, перебивки, монтаж по движению и по взгляду. Чем сильнее эмоция, тем крупнее план."},
  cartoon:{name:"Мультфильм",desc:"Анимация по 12 принципам Disney",icon:'<circle cx="19" cy="20" r="11" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="9" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="28" cy="9" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M14 23c2 3 8 3 10 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',

async function runJob(kind,label,prompt,opts={}){
  if(!sampleFn){lastError="Генерация работает, когда приложение открыто в Claude. Пример и шпаргалка доступны всегда.";render();return null}
  if(job) return null;
  const ctl=new AbortController();
  job={kind,label,ctl,chars:0,start:Date.now(),shot:opts.shot};lastError="";render();
  const tick=setInterval(updateJob,1000);
  try{
    const data=await sampleFn.json(prompt,{signal:ctl.signal,cache:false,modelTier:opts.tier||"default",onText:({text})=>{if(job){job.chars=text.length;updateJob()}}});
    return data;
  }catch(e){
    if(e?.code!=="cancelled") lastError=errText(e); else toast("Генерация остановлена");
    return null;
  }finally{clearInterval(tick);job=null;render()}
}
function updateJob(){
  const el=$("#jobInfo"); if(!el||!job) return;
  const sec=Math.round((Date.now()-job.start)/1000);
  el.textContent = job.chars? `Написано ${job.chars.toLocaleString("ru-RU")} знаков · ${sec} с` : `Режиссёр думает… ${sec} с`;
}

function parseOutsee(res){
  const p=res?.payload, o=(p&&typeof p==="object")?p:{};
  const text=[typeof p==="string"?p:(o.message||""),...(res?.content||[]).filter(c=>c.type==="text").map(c=>c.text)].join(" ");
  const items=o.items||o.result?.items||[];
  let url=o.url||o.result_url||o.file_url||o.result?.url||items[0]?.url||o.entries?.[0]?.url;
  if(!url){const m=text.match(/https:\/\/outsee\.io\/f\/[^\s"'<>)]+/);if(m)url=m[0]}
  let id=o.id??o.job_id??o.task_id??o.work_id??o.result?.id??o.entries?.[0]?.id;
  if(id==null){const m=text.match(/№\s?(\d+)/);if(m)id=Number(m[1])}
  const status=String(o.status||"").toLowerCase();
  const img=(res?.content||[]).find(c=>c.type==="image"&&c.data);
  return {url,id:id!=null?Number(id):null,status,failed:/fail|error|cancel|reject/.test(status),
    needConfirm:!url&&o.cost!=null&&(o.view==="plan"||o.view==="confirm"),cost:o.cost,balance:o.balance,message:o.message||text,
    thumb:img?`data:${img.mimeType};base64,${img.data}`:null};
}

  if(c==="selection_required") return "У вас несколько коннекторов Outsee. Выберите один в окне Claude.";
  if(c==="not_in_manifest") return "Outsee не разрешён для этой страницы. Разрешите его в окне Claude и попробуйте снова.";
  if(c==="blocked_by_policy"||c==="approval_required") return "Outsee заблокирован настройками вашей организации.";
  if(c==="tool_error") return "Outsee ответил: "+(e.message||"ошибка");
  if(c==="not_granted"||c==="capability_disabled"||c==="capability_removed") return "Outsee недоступен в этом окне. Откройте приложение в Claude.";

async function osRun(key,kind){
  const s=slot(key,kind); const args=argsFor(key,kind);
  if(s.confirmCost!=null) args.confirm_cost=s.confirmCost;
  Object.assign(s,{status:"running",start:Date.now(),err:"",url:undefined,id:undefined,thumb:undefined}); save(); render();
  try{
    const res=await mcpNs.callTool(OS,TOOL[kind],args,{cache:false});
    const r=parseOutsee(res);
    if(r.url) return osDone(s,r);
    if(r.needConfirm){Object.assign(s,{status:"confirm",cost:r.cost,balance:r.balance,confirmCost:r.cost,note:"Работа дороже обычной, подтвердите цену."});save();render();return}
    if(r.id==null){Object.assign(s,{status:"error",err:"Outsee не вернул номер работы. Проверьте библиотеку Outsee."});save();render();return}
    s.id=r.id; save(); await osPoll(s);
  }catch(e){Object.assign(s,{status:"error",err:osErr(e,true)});save();render()}
}
function osDone(s,r){
  Object.assign(s,{status:"done",url:r.url,thumb:r.thumb||s.thumb,id:r.id??s.id,note:""});
  save(); render(); toast("Outsee: готово");
}
async function osPoll(s){
  s.status="running"; render();
  for(let t=0;t<60;t++){
    try{
      const res=await mcpNs.callTool(OS,"check_status",{id:s.id},{cache:false});
      const r=parseOutsee(res);
      if(r.url) return osDone(s,r);
      if(r.failed){Object.assign(s,{status:"error",err:r.message||"Outsee не смог выполнить работу."});save();render();return}
    }catch(e){
      if(e?.code==="tool_error"){Object.assign(s,{status:"error",err:osErr(e,false)});save();render();return}
      if(!(e?.retryable||e?.code==="server_unavailable"||e?.code==="upstream_error")){Object.assign(s,{status:"error",err:osErr(e,false)});save();render();return}
      await sleep(e?.retryAfterMs||4000);
    }
    await sleep(3000);
  }
  Object.assign(s,{status:"error",err:`Работа №${s.id} ещё идёт. Загляните в библиотеку Outsee позже.`}); save(); render();
}
function resumeJobs(){
  for(const key in state.media) for(const kind in state.media[key]){
    const s=state.media[key][kind];
    if(s.status==="running"){ if(s.id!=null&&mcpNs) osPoll(s); else Object.assign(s,{status:"error",err:"Страница перезагрузилась во время запуска. Проверьте библиотеку Outsee."}) }
    if(s.status==="estimating") s.status="idle";
  }
}
function slotView(key,kind,opts={}){
  const s=peek(key,kind), K=kind==="image"?"Фото":"Видео", da=`data-key="${key}" data-kind="${kind}"`;
  let body;
  if(opts.blocked) body=`<span class="st">${esc(opts.blocked)}</span>`;
  else if(s.status==="estimating") body=`<span class="dot"></span><span class="st">Считаю цену…</span>`;
  else if(s.status==="running") body=`<span class="dot"></span><span class="st">Генерирую${s.id!=null?" · работа №"+s.id:""} · <span class="mono" data-timer="${s.start||Date.now()}">0:00</span></span><span class="st">${kind==="video"?"видео занимает до 20 минут":"обычно до минуты"}</span>`;
  else if(s.status==="confirm") body=`<span class="price">${s.cost!=null?s.cost+" ток.":"цена не указана"}${s.balance!=null?" · баланс "+s.balance:""}</span>${s.note?`<span class="st">${esc(s.note)}</span>`:""}<button class="btn small primary" data-os="run" ${da}>Запустить</button><button class="btn small" data-os="cancel" ${da}>Отмена</button>`;
  else if(s.status==="done") body=`<span class="good">Готово</span><a href="${esc(s.url)}" target="_blank" rel="noopener">Открыть ${kind==="image"?"фото":"видео"} ↗</a><button class="btn small" data-os="link" ${da}>Ссылка</button><button class="btn small" data-os="est" ${da}>Ещё вариант</button>${s.thumb?`<img class="os-thumb" src="${s.thumb}" alt="">`:""}`;
  else if(s.status==="error") body=`<span class="bad">${esc(s.err)}</span><button class="btn small" data-os="est" ${da}>Попробовать снова</button>`;
  else body=`<button class="btn small" data-os="est" ${da} ${mcpNs?"":"disabled"}>${K} в Outsee</button>${opts.hint?`<span class="st">${esc(opts.hint)}</span>`:""}`;
  return `<div class="os-row"><span class="k">${K}</span>${body}</div>`;
}
function osBlock(key,{video=true,imgHint=""}={}){
  const hasImg=!!peek(key,"image").url;
  return `<div class="os"><div class="os-h"><span class="label">Генерация в Outsee</span>${mcpNs?"":`<span class="muted" style="font-size:.78rem">доступно в Claude с подключённым Outsee</span>`}</div>
    ${slotView(key,"image",{hint:imgHint})}
    ${video?slotView(key,"video",{blocked:hasImg?"":"Сначала фото: видео начнётся с него, так сохраняется лицо."}):""}</div>`;
}

/* ---------- схема крупности ---------- */
function sizeKey(s){
  s=String(s||"").toLowerCase();
  if(/сверхкруп|extreme close|ecu/.test(s)) return "xcu";
  if(/детал|макро|macro|insert|detail/.test(s)) return "detail";
  if(/средне-круп|средний круп|medium close|mcu/.test(s)) return "mcu";
  if(/круп|close/.test(s)) return "cu";
  if(/средне-общ|medium long|cowboy/.test(s)) return "mls";
  if(/средн|medium/.test(s)) return "ms";
  if(/дальн|extreme long|extreme wide|establish/.test(s)) return "els";
  if(/общ|long|wide|full/.test(s)) return "ls";
  return "ms";
}
const WIN={els:[-110,280],ls:[-8,116],mls:[-6,82],ms:[-5,56],mcu:[-3,36],cu:[-1.5,24],xcu:[3.2,8.5]};
function arNum(){const [a,b]=state.ar.split(":").map(Number);return a/b}
function frameSVG(size,arStr){
  const k=sizeKey(size), ar=arStr?(([a,c])=>a/c)(arStr.split(":").map(Number)):arNum();
  if(k==="detail"){
    const w=100*ar;
    let waves="";for(let i=0;i<9;i++){const y=12+i*10;waves+=`<path d="M0 ${y} Q ${w/4} ${y-7} ${w/2} ${y} T ${w} ${y}" fill="none" stroke="currentColor" stroke-width="1.3" opacity="${.35+i%3*.2}"/>`}
    return `<svg viewBox="0 0 ${w} 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${waves}<circle cx="${w/2}" cy="50" r="20" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3"/></svg>`;
  }
  const [y,h]=WIN[k], w=h*ar;
  return `<svg viewBox="${50-w/2} ${y} ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <line x1="-500" y1="100" x2="600" y2="100" stroke="currentColor" stroke-width="${h/150}" opacity=".4"/>
    <g fill="currentColor"><ellipse cx="50" cy="8" rx="5.6" ry="7.2"/><rect x="47.8" y="13" width="4.4" height="4"/>
    <path d="M43 16 L57 16 Q63 17.5 63.5 23 L61 44 L62 53 L58.5 100 L52.5 100 L50 60 L47.5 100 L41.5 100 L38 53 L39 44 L36.5 23 Q37 17.5 43 16Z"/>
    <path d="M37.5 19 L33 44 L35.5 45 L40 24Z M62.5 19 L67 44 L64.5 45 L60 24Z"/></g>
    <g fill="var(--bg)"><ellipse cx="47.6" cy="7.3" rx="1.1" ry=".55"/><ellipse cx="52.4" cy="7.3" rx="1.1" ry=".55"/></g>
  </svg>`;
}

    ${state.isExample?`<div class="note ex"><b>Это пример проекта.</b> Так выглядит результат для вымышленного бренда Maison Lune. Нажмите «Новый проект», чтобы собрать свой ролик.</div>`:""}
    <section class="panel stack">
      <div class="hero-r"><span class="label">${esc(secName())} · <span class="mono">${state.dur} с · ${esc(state.ar)} · ${r.shots.length} кадров</span></span><h2>${esc(r.title)}</h2><p class="logline">${esc(r.logline)}</p><p class="concept">${esc(r.concept)}</p></div>
      <div class="arc">${r.structure.map(a=>`<div><span class="mono">${esc(a.time)}</span><b>${esc(a.act)}</b><p>${esc(a.goal)}</p></div>`).join("")}</div>
      <div class="actions" style="justify-content:flex-start">
        <button class="btn primary" data-act="copyall">Копировать все промпты</button>
        <button class="btn" data-act="md">Скачать сценарий (.md)</button>
        <span class="sp"></span><button class="btn" data-act="new">Новый проект</button>
      </div>
    </section>
    <section class="stack"><div class="head"><span class="label">Библия проекта</span><h3>Одно лицо, один свет, один стиль</h3></div>
      <div class="bible">
        <div class="bcard"><div class="bh"><b>Паспорт героя${r.character?.name?": "+esc(r.character.name):""}</b>${copyBtn("bb-id")}</div>
          <div class="code" id="bb-id">${esc(r.character?.id_block)}</div>
          <p class="kv"><b>Гардероб:</b> ${esc(r.character?.wardrobe)}</p><p class="kv"><b>Дуга:</b> ${esc(r.character?.emotion_arc)}</p></div>
        <div class="bcard"><div class="bh"><b>Визуальный стиль</b>${copyBtn("bb-st")}</div><p class="kv">${esc(r.style?.look)}</p>
          <div class="code" id="bb-st">${esc(r.style?.style_block)}\n\nNegative: ${esc(r.style?.negative)}</div></div>
        <div class="bcard"><div class="bh"><b>Шаг 0: лист персонажа</b>${copyBtn("bb-sh")}</div><p class="kv muted">Сгенерируйте первым и используйте как референс лица во всех кадрах.</p>
          <div class="code" id="bb-sh">${esc(assemble(r.character_sheet_prompt,"sheet"))}</div>
          ${osBlock("sheet",{video:false,imgHint:"Сделайте первым: лицо с него перейдёт во все кадры"})}</div>
      </div>
    </section>
    <section class="panel stack"><div class="head"><span class="label">Outsee</span><h3>Генерация фото и видео</h3><p class="muted">Порядок: лист персонажа → фото кадра → видео из этого фото. Перед каждым запуском покажем цену в токенах Outsee.</p></div>${osSettings()}</section>
    <section class="panel stack"><div class="row" style="justify-content:space-between"><h3>Монтажная линейка</h3><div class="legend">${ACTS.map(a=>`<span><i style="background:${actColor(a)}"></i>${a}</span>`).join("")}</div></div>
      <div><div class="timeline">${tl}</div><div class="tl-scale">${ticks}</div></div>${sumWarn}</section>
    <section class="stack">${shots}</section>
    ${r.tips.length?`<section class="panel stack"><h3>Как сохранить героя в этом ролике</h3><ol class="tips">${r.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ol></section>`:""}
  </div>`;
}
const CHEAT=[
  ["Крупность планов",[["Дальний план","extreme long shot","Человек мал в пространстве: масштаб, одиночество, мир бренда."],["Общий план","long shot / full shot","Фигура целиком: пространство и посадка одежды."],["Средне-общий","medium long shot","До колен: поза и жест."],["Средний","medium shot","До пояса: действие и взаимодействие."],["Средне-крупный","medium close-up","До груди: эмоция плюс контекст."],["Крупный","close-up","Лицо: главная эмоция, связь со зрителем."],["Сверхкрупный","extreme close-up","Глаза, губы: пик напряжения."],["Деталь / макро","macro detail shot","Фактура продукта, швы, кружево."]]],
  ["Ракурсы",[["Уровень глаз","eye level","Нейтрально и честно."],["Нижний","low angle","Сила, уверенность, статус."],["Верхний","high angle","Нежность, уязвимость."],["Сверху вниз","top-down / bird's-eye view","Графика и композиция."],["Голландский угол","dutch angle","Тревога, нестабильность."],["Через плечо","over-the-shoulder shot","Диалог, точка зрения."],["Через отражение","mirror reflection shot","Второй план, взгляд на себя."],["Субъективная камера","POV shot","Зритель на месте героя."]]],
  ["Движение камеры",[["Наезд","slow push-in / dolly in","Усиливает эмоцию, приближает к мысли героя."],["Отъезд","pull-back / dolly out","Раскрывает контекст, хорошо для финала."],["Панорама","pan","Обзор, связь двух точек."],["Проезд вбок","lateral tracking shot","Сопровождение, параллакс."],["Кран","crane up / crane down","Масштаб, торжественность."],["Облёт","orbit / arc shot","Объём, кульминация."],["Стедикам","steadicam follow shot","Плавное следование за героем."],["Статика","locked-off static shot","Спокойствие, внимание к действию."]]],
  ["Свет",[["Рисующий","key light","Основной свет, лепит форму лица."],["Заполняющий","fill light","Смягчает тени."],["Контровой","backlight / rim light","Отделяет от фона, ореол на волосах."],["Рембрандт","Rembrandt lighting","Треугольник света на щеке, драма."],["Бабочка","butterfly lighting","Бьюти и гламур."],["Золотой час","golden hour light","Тёплый низкий свет, романтика."],["Практические источники","practical lights","Лампы в кадре мотивируют свет."],["Low-key / High-key","low-key / high-key lighting","Контрастная драма или светлая лёгкость."]]],
  ["Монтажная грамматика",[["Правило 180°","180-degree rule","Камера остаётся по одну сторону линии взаимодействия."],["Правило 30°","30-degree rule","При склейке меняйте угол минимум на 30° или крупность."],["Чередование крупностей","shot size variation","Не ставьте два одинаковых плана подряд."],["Монтаж по движению","cut on action","Склейка в середине движения скрывает шов."],["Рифма кадра","match cut","Похожая форма или движение связывает сцены."],["Перебивка","cutaway / insert","Деталь дарит ритм и время."]]],
  ["Драматургия рекламы",[["Хук, 0–3 с","hook","Самый необычный кадр ролика."],["Завязка","setup","Героиня и её мир."],["Развитие","development","Рост эмоции."],["Кульминация","climax","Пик эмоции совпадает с продуктом."],["Пэкшот / CTA","packshot / call to action","Продукт, логотип, призыв."],["Сохранение героя","character consistency","Паспорт героя, лист персонажа, один seed."]]]
];
function cheat(){
  return `<div class="stack"><div class="head"><span class="label">Справочник</span><h2>Шпаргалка режиссёра</h2><p class="muted">Нажмите английский термин, чтобы скопировать его в промпт.</p></div>
  <div class="cheat">${CHEAT.map(([t,items])=>`<section class="cgroup"><h3>${t}</h3><dl>${items.map(([ru,en,n])=>`<div class="it"><dt>${ru}</dt><button class="en" data-term="${esc(en)}">${esc(en)}</button><dd>${n}</dd></div>`).join("")}</dl></section>`).join("")}</div></div>`;
}
function render(){
  const a=document.activeElement, fid=a&&a.id&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)?a.id:null;
  const sel=fid&&a.selectionStart!=null?[a.selectionStart,a.selectionEnd]:null;
  renderInner();
  if(fid){const n=document.getElementById(fid);if(n){n.focus({preventScroll:true});if(sel&&n.setSelectionRange)try{n.setSelectionRange(sel[0],sel[1])}catch{}}}
}
setInterval(()=>document.querySelectorAll("[data-timer]").forEach(el=>{el.textContent=fmtT(Math.max(0,Math.round((Date.now()-Number(el.dataset.timer))/1000)))}),1000);
function renderInner(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===state.tab)));
  const app=$("#app");
  if(state.tab==="cheat"){app.innerHTML=cheat();return}
  if(state.tab==="builder"){app.innerHTML=builder();updateJob();return}
  const noGen = runtimeChecked && !sampleFn ? `<p class="note" style="margin-bottom:16px">Генерация работает, когда приложение открыто в Claude. Пример проекта и шпаргалка доступны всегда.</p>`:"";
  app.innerHTML = stepper()+jobBar()+(state.step===1||state.step===2?"":"")+( [0,step1,step2,step3,step4][state.step]() )+(state.step<4?noGen:"");
  updateJob();
}
function flashShot(i){const el=$("#shot-"+i);if(!el)return;el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1400)}

/* ---------- события ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  const d=t.dataset;
  if(d.tab){state.tab=d.tab;save();render();return}
  if(d.step){state.step=Number(d.step);save();render();window.scrollTo({top:0});return}
  if(d.set){state[d.set]=["dur"].includes(d.set)?Number(d.val):d.val;save();render();return}
  if(d.ans!==undefined){const i=Number(d.ans);state.answers[i]=state.answers[i]===d.val?"":d.val;save();render();return}
  if(d.goto!==undefined){flashShot(Number(d.goto));return}
  if(d.copy){const el=document.getElementById(d.copy);if(el)copy(el.value??el.textContent,"Промпт");return}
  if(d.term){copy(d.term,"Термин");return}
  if(d.os){const k=d.key,kind=d.kind;
    if(d.os==="est") osEstimate(k,kind);
    else if(d.os==="run") osRun(k,kind);
    else if(d.os==="cancel"){slot(k,kind).status=peek(k,kind).url?"done":"idle";save();render()}
    else if(d.os==="link") copy(peek(k,kind).url,"Ссылка");
    return}
  if(d.bset){const b=state.builder;b[d.bset]=d.bset==="dur"?Number(d.val):d.val;if(d.bset==="kind"){b.improved=null;delete state.media.builder}save();render();return}
  if(d.pick){const b=state.builder,c=d.pick;
    if(c==="focus"||c==="mood") b[c]=b[c]===d.val?null:d.val; else b.sel[c]=b.sel[c]===d.val?null:d.val;
    save();render();return}
  switch(d.act){
    case "stop": job?.ctl.abort(); break;
    case "ask": askQuestions(); break;
    case "direct": state.questions=[];state.answers={};buildScript(); break;
    case "build": buildScript(); break;
    case "advise": builderAdvise(); break;
    case "improve": builderImprove(); break;
    case "unimprove": state.builder.improved=null; delete state.media.builder; save(); render(); break;
    case "applyrecs": {const r=brecs();bcats().forEach(c=>{if(r[c.id]&&!["focus","mood"].includes(c.id)) state.builder.sel[c.id]=r[c.id].id});save();render();toast("Советы применены");break}
    case "breset": state.builder=migrate({}).builder; delete state.media.builder; save(); render(); window.scrollTo({top:0}); break;
    case "example": {const ex=exampleState();Object.assign(state,{...ex,tab:"project",builder:state.builder,media:{builder:state.media.builder}});save();render();window.scrollTo({top:0});break}
    case "redo": redoShot(Number(d.i)); break;
    case "copyall": copy(allPrompts(),"Все промпты"); break;
    case "md": downloadMd(); break;
    case "new": {const keep={gen:state.gen,imggen:state.imggen,plang:state.plang,depth:state.depth};state=migrate(Object.assign(blankState(),keep,{builder:state.builder,media:{builder:state.media.builder}}));lastError="";save();render();window.scrollTo({top:0});break}
  }
});
document.addEventListener("input",e=>{
  const t=e.target, d=t.dataset;
  if(d.brief){state.brief[d.brief]=t.value;state.isExample=false;save()}
  else if(d.rules!==undefined){rules=t.value;saveRules(rules)}
  else if(d.ansinput!==undefined){state.answers[Number(d.ansinput)]=t.value;save();
    t.closest(".q").querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-pressed","false"))}
  else if(d.redo!==undefined){redoWish[Number(d.redo)]=t.value}
  else if(d.breq!==undefined){state.builder.req=t.value;save();const a=$("#bp-img"),v=$("#bp-vid");if(a)a.textContent=builtImage();if(v)v.textContent=builtVideo()}
  else if(d.bimp&&state.builder.improved){state.builder.improved[d.bimp]=t.value;save()}
  else if(d.oset){state[d.oset]=t.value;save()}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset?.redo!==undefined){e.preventDefault();redoShot(Number(e.target.dataset.redo))}});

render();
(async()=>{
  const use=window.claude?.use;
  if(use){
    const u=n=>window.claude.use(n).catch(()=>null);
    [sampleFn,downloadsNs,mcpNs]=await Promise.all([u("sample"),u("downloads"),u("mcp")]);
  }
  runtimeChecked=true; resumeJobs(); save(); render();
})();
</script>
